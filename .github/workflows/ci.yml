name: CaptionStudio CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Linting
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Prepare Test Environment
        run: |
          mkdir -p backend/storage/uploads backend/storage/renders backend/storage/thumbnails
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>CaptionStudio</title></head><body>CaptionStudio AI Video Engine</body></html>' > frontend/dist/index.html

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: sqlite:///./test_saas.db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test_saas.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_environment_32chars
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck & Build
        run: |
          cd frontend
          npm run build

