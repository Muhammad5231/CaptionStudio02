version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: captionstudio-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://caption_user:caption_pass@postgres:5432/captionstudio
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=generate_a_secure_random_64_char_key_in_production
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - STORAGE_DRIVER=local
      - STORAGE_DIR=storage
      - MAX_UPLOAD_SIZE_MB=500
      - INITIAL_ADMIN_EMAIL=admin@captionstudio.com
      - INITIAL_ADMIN_PASSWORD=Admin12345!
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8000,http://localhost:3000
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: captionstudio-postgres
    environment:
      - POSTGRES_USER=caption_user
      - POSTGRES_PASSWORD=caption_pass
      - POSTGRES_DB=captionstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caption_user -d captionstudio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: captionstudio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:

